name: CI Quality Gate

on:
  pull_request:
    branches:
      - deploy/guara
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-tests:
    name: Testes de Segurança e Integração
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependências determinísticas
        run: npm ci

      - name: Executar testes automatizados em memória (Brevo e CNPJ)
        run: node --test "tests/*.test.ts"

  build-check:
    name: Verificação de Build de Produção
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependências determinísticas
        run: npm ci

      - name: Compilar aplicação para produção (Nitro node-server)
        env:
          NITRO_PRESET: node-server
          NODE_ENV: production
        run: npm run build

  code-analysis:
    name: Análise Estática (TypeScript e Lint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependências determinísticas
        run: npm ci

      - name: Checagem estática de tipos (TypeScript)
        run: npx tsc --noEmit

      - name: Análise de regras de código (ESLint)
        run: 'npx eslint src/ --rule "prettier/prettier: off"'
